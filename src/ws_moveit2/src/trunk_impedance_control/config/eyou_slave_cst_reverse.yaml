# EYOU CST slave config for reversed joints (0x6071/0x6077: per thousand of rated current)
vendor_id: 0x00001097
product_id: 0x00010002

assign_activate: 0x0300
auto_fault_reset: false

sdo: []

rpdo:
  - index: 0x1600
    channels:
      - {index: 0x6040, sub_index: 0, type: uint16, default: 0}
      - {index: 0x6060, sub_index: 0, type: int8,   default: 10}
      - {index: 0x607A, sub_index: 0, type: int32,  default: 0}
      - {index: 0x6081, sub_index: 0, type: uint32, default: 1000}
      - {index: 0x60FF, sub_index: 0, type: int32,  default: 0}
      - {index: 0x240D, sub_index: 0, type: uint32, default: 1000}
      - {index: 0x6071, sub_index: 0, type: int16,  command_interface: effort, factor: 100.0, default: 0}
      - {index: 0x6083, sub_index: 0, type: uint32, default: 1000}
      - {index: 0x6084, sub_index: 0, type: uint32, default: 1000}
      - {index: 0x6087, sub_index: 0, type: uint32, default: 1000}

tpdo:
  - index: 0x1A00
    channels:
      - {index: 0x6041, sub_index: 0, type: uint16}
      - {index: 0x6061, sub_index: 0, type: int8}
      - {index: 0x603F, sub_index: 0, type: uint16}
      - {index: 0x6064, sub_index: 0, type: int32, state_interface: position, factor: -9.904318103600473e-08}
      - {index: 0x606C, sub_index: 0, type: int32, state_interface: velocity, factor: -9.904318103600473e-08}
      - {index: 0x6077, sub_index: 0, type: int16, state_interface: effort, factor: 0.01}
      - {index: 0x6074, sub_index: 0, type: int16}
      - {index: 0x60F4, sub_index: 0, type: int32}
      - {index: 0x6079, sub_index: 0, type: uint32}
      - {index: 0x60FD, sub_index: 0, type: uint32}

sm:
  - {index: 0, type: output, pdo: ~,    watchdog: disable}
  - {index: 1, type: input,  pdo: ~,    watchdog: disable}
  - {index: 2, type: output, pdo: rpdo, watchdog: enable}
  - {index: 3, type: input,  pdo: tpdo, watchdog: disable}
